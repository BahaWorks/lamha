# Fetches the latest headlines and commits them to the repo.
# Each commit triggers Cloudflare Pages, which renders and publishes the site
# (build command: node src/build.mjs --render, output folder: dist).
# Schedule times are UTC. Run it by hand from the Actions tab with "Run workflow".
name: Update headlines

on:
  schedule:
    - cron: "0 7,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lamha-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch feeds and build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/build.mjs
      - name: Commit headline data
        run: |
          git config user.name "lamha-bot"
          git config user.email "lamha-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Headlines $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
      - name: Tell search engines the pages changed (IndexNow)
        continue-on-error: true
        run: |
          sleep 180  # give Cloudflare Pages time to publish the new build
          KEY=$(node -p "require('./config/site.json').indexNowKey")
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"lamha-sd.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://lamha-sd.com/$KEY.txt\",\"urlList\":[\"https://lamha-sd.com/ar/\",\"https://lamha-sd.com/en/\",\"https://lamha-sd.com/ar/official/\",\"https://lamha-sd.com/en/official/\",\"https://lamha-sd.com/ar/sports/\",\"https://lamha-sd.com/en/sports/\"]}"
