# Fetches the latest headlines and commits them to the repo.
# Each commit triggers Cloudflare Pages, which renders and publishes the site
# (build command: node src/build.mjs --render, output folder: dist).
# Schedule times are UTC. Run it by hand from the Actions tab with "Run workflow".
name: Update headlines

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lamha-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch feeds and build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/build.mjs
      - name: Commit headline data
        run: |
          git config user.name "lamha-bot"
          git config user.email "lamha-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Headlines $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
